name: Prepare Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          architecture: x64
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv --without-pip .build-venv
          if ($LASTEXITCODE) { throw 'venv creation failed' }
          python -m pip --python .build-venv/Scripts/python.exe install -r requirements.txt
          if ($LASTEXITCODE) { throw 'dependency installation failed' }
      - name: Full synthetic test suite and frozen EXE validation
        shell: pwsh
        run: |
          .build-venv/Scripts/python.exe build.py
          if ($LASTEXITCODE) { throw 'build or validation failed' }
      - name: Audit and prepare candidate artifacts
        shell: pwsh
        run: |
          .build-venv/Scripts/python.exe .github/scripts/prepare_candidate.py
          if ($LASTEXITCODE) { throw 'candidate privacy or integrity verification failed' }
      - name: Store candidate for review (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: OcarinaSaveBridge-1.0.2-windows-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
      - name: Report results
        shell: pwsh
        run: |
          Get-Content -LiteralPath candidate/test-summary.json
          Get-Content -LiteralPath candidate/privacy-check.json
          Get-Content -LiteralPath candidate/SHA256SUMS.txt
          'Candidate prepared. Public release publication requires separate user approval.' >> $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath candidate/SHA256SUMS.txt >> $env:GITHUB_STEP_SUMMARY

